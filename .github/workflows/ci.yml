name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: workhorse validate examples/demo/manifest.json
      - run: workhorse review examples/demo/manifest.json --output reports/demo
      - run: workhorse compare-configs examples/demo/manifest.json --output reports/demo/configuration-comparison.json
      - run: workhorse evaluate examples/benchmark/cases.json --output reports/demo/evaluation.json
      - run: workhorse-calibrate examples/benchmark/cases.json --thresholds 0.35 0.5 0.65 0.8 --output reports/demo/calibration.json
      - run: workhorse-functions examples/demo/manifest.json reports/demo/report.json --output reports/demo/functions.json --html reports/demo/functions.html
      - run: workhorse-moss prepare examples/demo/manifest.json --output data/moss-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-demo-${{ matrix.python }}
          path: reports/demo/
