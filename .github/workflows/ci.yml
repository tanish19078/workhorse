name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: workhorse validate examples/demo/manifest.json
      - run: workhorse review examples/demo/manifest.json --output reports/demo
      - run: workhorse evaluate examples/benchmark/cases.json --output reports/demo/evaluation.json
      - run: workhorse-calibrate examples/benchmark/cases.json --thresholds 0.35 0.5 0.65 0.8 --output reports/demo/calibration.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-${{ matrix.python }}
          path: reports/demo/
