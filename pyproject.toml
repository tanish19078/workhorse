[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workhorse-review"
version = "0.4.0"
description = "Local source similarity review with explainable evidence"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
workhorse = "workhorse.cli:main"
workhorse-moss = "workhorse.moss:main"
workhorse-functions = "workhorse.function_signals:main"

[tool.setuptools.packages.find]
where = ["src"]

